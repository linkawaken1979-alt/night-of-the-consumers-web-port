<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Unity WebGL Player | NIGHT OF THE CONSUMERS</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #unity-canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: none;
      background: #000;
      cursor: crosshair;
      touch-action: none;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #000;
      transition: opacity .35s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #unity-logo {
      width: min(180px, 42vw);
      max-height: 100px;
      object-fit: contain;
      margin-bottom: 25px;
      filter: grayscale(1);
    }

    #game-title {
      margin-bottom: 22px;
      font-size: clamp(16px, 3vw, 23px);
      font-weight: 700;
      letter-spacing: 4px;
      text-align: center;
    }

    #progress-container {
      width: min(340px, 75vw);
      height: 5px;
      background: #252525;
      overflow: hidden;
      margin-bottom: 15px;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width .15s linear;
    }

    #loading-status {
      width: min(340px, 75vw);
      min-height: 18px;
      color: #aaa;
      font-size: 12px;
      letter-spacing: 1px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    #loading-percent {
      margin-top: 9px;
      color: #666;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    #loading-error {
      display: none;
      width: min(500px, 85vw);
      margin-top: 20px;
      color: #ff6666;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas" tabindex="0"></canvas>

  <div id="loading-screen">
    <img id="unity-logo" src="https://raw.githack.com/linkawaken1979-alt/night-of-the-consumers-web-port/main/TemplateData/unity-logo-light.png" alt="Unity">
    <div id="game-title">NIGHT OF THE CONSUMERS</div>

    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>

    <div id="loading-status">INITIALIZING...</div>
    <div id="loading-percent">0%</div>
    <div id="loading-error"></div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("unity-canvas");
      const loadingScreen = document.getElementById("loading-screen");
      const progressBar = document.getElementById("progress-bar");
      const statusText = document.getElementById("loading-status");
      const percentText = document.getElementById("loading-percent");
      const errorText = document.getElementById("loading-error");

      const repoBase = "https://raw.githack.com/linkawaken1979-alt/night-of-the-consumers-web-port/main";
      const buildUrl = repoBase + "/Build";

      (function() {
        let lastLockAttempt = 0;
        let isUserInitiated = false;
        let virtualX = window.innerWidth / 2;
        let virtualY = window.innerHeight / 2;

        const nativeExitLock = document.exitPointerLock;
        document.exitPointerLock = function() {
          if (!isUserInitiated) {
            console.warn("[PointerLock] Intercepted programmatic exitPointerLock from Unity.");
            return;
          }
          return nativeExitLock.apply(document, arguments);
        };

        window.addEventListener("keydown", function(e) {
          if (e.key === "Escape" || e.keyCode === 27) {
            isUserInitiated = true;
            nativeExitLock.call(document);
            setTimeout(() => { isUserInitiated = false; }, 100);
          }
        });

        function safeRequestLock() {
          const now = performance.now();
          if (document.pointerLockElement === canvas) return;
          if (now - lastLockAttempt < 1200) return;

          lastLockAttempt = now;
          canvas.focus();

          try {
            const res = canvas.requestPointerLock();
            if (res && typeof res.catch === 'function') {
              res.catch((err) => {
                console.warn("[PointerLock] Lock deferred by browser:", err.message);
              });
            }
          } catch(e) {}
        }

        window.addEventListener("click", safeRequestLock, true);
        canvas.addEventListener("mousedown", safeRequestLock, true);

        const origAddEventListener = EventTarget.prototype.addEventListener;
        EventTarget.prototype.addEventListener = function(type, listener, options) {
          if (type === 'mousemove' && typeof listener === 'function') {
            const wrappedListener = function(event) {
              if (document.pointerLockElement === canvas) {
                let dx = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
                let dy = event.movementY || event.mozMovementY || event.webkitMovementY || 0;

                if (Math.abs(dx) > 250 || Math.abs(dy) > 250) {
                  dx = 0;
                  dy = 0;
                }

                virtualX += dx;
                virtualY += dy;

                Object.defineProperty(event, 'movementX', { value: dx, configurable: true });
                Object.defineProperty(event, 'movementY', { value: dy, configurable: true });
                Object.defineProperty(event, 'clientX', { value: virtualX, configurable: true });
                Object.defineProperty(event, 'clientY', { value: virtualY, configurable: true });
                Object.defineProperty(event, 'screenX', { value: virtualX, configurable: true });
                Object.defineProperty(event, 'screenY', { value: virtualY, configurable: true });
              }
              return listener.apply(this, arguments);
            };
            return origAddEventListener.call(this, type, wrappedListener, options);
          }
          return origAddEventListener.call(this, type, listener, options);
        };

        document.addEventListener('pointerlockchange', function() {
          const locked = document.pointerLockElement === canvas;
          canvas.style.cursor = locked ? "none" : "crosshair";
          if (locked) {
            virtualX = window.innerWidth / 2;
            virtualY = window.innerHeight / 2;
          }
        });
      })();

      (function() {
        var originalConsoleError = console.error;
        console.error = function() {
          var msg = arguments[0] ? arguments[0].toString() : "";
          if (msg.indexOf("Set Method not found for 'mesh'") !== -1) return;
          originalConsoleError.apply(console, arguments);
        };
      })();

      (function() {
        var open = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
          if (typeof url === 'string' && url.indexOf("http") !== 0) {
            if (url.indexOf("Build/") !== -1) {
              url = buildUrl + "/" + url.substring(url.indexOf("Build/") + 6);
            }
          }
          return open.apply(this, arguments);
        };

        var originalFetch = window.fetch;
        window.fetch = function(resource, init) {
          var url = typeof resource === 'string' ? resource : (resource ? resource.url : '');
          if (typeof url === 'string' && url.indexOf("http") !== 0) {
            if (url.indexOf("Build/") !== -1) {
              url = buildUrl + "/" + url.substring(url.indexOf("Build/") + 6);
            }
          }
          return originalFetch(url, init);
        };
      })();

      function setLoading(percent, message) {
        const value = Math.max(0, Math.min(100, percent));
        progressBar.style.width = value + "%";
        percentText.textContent = Math.round(value) + "%";
        statusText.textContent = message;
      }

      function showError(error) {
        console.error("[Unity] Failed to load:", error);
        statusText.textContent = "LOADING FAILED";
        errorText.style.display = "block";
        errorText.textContent =
          (error && error.message ? error.message : String(error)) +
          " — Check the browser console and file URLs.";
      }

      function resizeCanvas() {
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      const WASM_CHUNK_COUNT = 2;

      async function loadSplitWasm() {
        const chunks = [];
        let totalBytes = 0;

        for (let i = 0; i < WASM_CHUNK_COUNT; i++) {
          const url = buildUrl + "/WebGL.wasm.__chunk__" + i;

          setLoading(
            3 + (i / WASM_CHUNK_COUNT) * 22,
            "DOWNLOADING WASM PART " + (i + 1) + " / " + WASM_CHUNK_COUNT + "..."
          );

          const response = await fetch(url);

          if (!response.ok) {
            throw new Error(
              "Could not download " + url + " (HTTP " + response.status + ")"
            );
          }

          const chunk = await response.arrayBuffer();

          if (chunk.byteLength === 0) {
            throw new Error("Empty WASM chunk: " + url);
          }

          chunks.push(chunk);
          totalBytes += chunk.byteLength;
        }

        setLoading(27, "COMBINING WASM PARTS...");

        const combined = new Uint8Array(totalBytes);
        let offset = 0;

        for (const chunk of chunks) {
          combined.set(new Uint8Array(chunk), offset);
          offset += chunk.byteLength;
        }

        setLoading(30, "WASM READY");
        return URL.createObjectURL(
          new Blob([combined], { type: "application/wasm" })
        );
      }

      async function startUnity() {
        try {
          setLoading(1, "INITIALIZING...");

          const wasmBlobUrl = await loadSplitWasm();

          setLoading(32, "STARTING UNITY...");

          await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = buildUrl + "/WebGL.loader.js";
            script.crossOrigin = "anonymous";
            script.onload = resolve;
            script.onerror = () => reject(new Error("Failed to load WebGL.loader.js from GitHack"));
            document.body.appendChild(script);
          });

          const config = {
            dataUrl: buildUrl + "/WebGL.data",
            frameworkUrl: buildUrl + "/WebGL.framework.js",
            codeUrl: wasmBlobUrl,
            streamingAssetsUrl: repoBase + "/StreamingAssets",
            companyName: "germfood",
            productName: "NIGHT OF THE CONSUMERS",
            productVersion: "1.0",
            matchWebGLToCanvasSize: true,
            devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
          };

          const unityInstance = await createUnityInstance(
            canvas,
            config,
            progress => {
              const percent = 32 + progress * 68;
              setLoading(
                percent,
                progress < 1
                  ? "LOADING GAME... " + Math.round(progress * 100) + "%"
                  : "STARTING GAME..."
              );
            }
          );

          window.unityInstance = unityInstance;
          URL.revokeObjectURL(wasmBlobUrl);

          setLoading(100, "READY");

          setTimeout(() => {
            loadingScreen.classList.add("hidden");
            setTimeout(() => {
              loadingScreen.style.display = "none";
              canvas.focus();
            }, 400);
          }, 250);

        } catch (error) {
          showError(error);
        }
      }

      startUnity();
    })();
  </script>
</body>
</html>
